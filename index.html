<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ultra Video Maker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/pi-auth.js"></script>

  <style>
    body{
      font-family: Arial;
      background:#0d1117;
      color:white;
      text-align:center;
      padding-top:60px;
    }
    button{
      padding:15px 25px;
      font-size:16px;
      border:none;
      border-radius:8px;
      margin:10px;
      cursor:pointer;
    }
    .signin{background:#f7931a;color:white;}
    .pay{background:#2ecc71;color:white;}
    .box{margin-top:30px;}
  </style>
</head>

<body>

<h1>🎬 Ultra Video Maker</h1>

<div class="box">
  <button id="signinBtn" class="signin">Sign in with Pi</button>
</div>

<div class="box">
  <button id="payBtn" class="pay" disabled>Pay with Pi (1π)</button>
</div>

<div id="status" class="box"></div>
<div id="userLine" class="box"></div>

</body>
</html>
