<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ultra Video Maker</title>

  <!-- Pi SDK (must be in HEAD) -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    :root{
      --bg:#0b0b0f;
      --card:#101017;
      --text:#ffffff;
      --muted:#c9c9d3;
      --orange:#f6a11a;
      --green:#2ecc71;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .wrap{width:100%; max-width:520px;}
    .title{
      font-size:52px;
      font-weight:800;
      letter-spacing:0.2px;
      margin:0 0 10px 0;
      line-height:1.02;
      text-align:left;
    }
    .subtitle{
      margin:0 0 18px 0;
      color:var(--muted);
      font-size:16px;
    }
    .btn{
      width:100%;
      border:none;
      border-radius:18px;
      padding:18px 18px;
      font-size:22px;
      font-weight:800;
      cursor:pointer;
      margin:14px 0;
    }
    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }
    .btn.orange{ background:var(--orange); color:#1a1a1a; }
    .btn.green{ background:var(--green); color:#0a0a0a; }

    .statusLine{
      margin-top:18px;
      font-size:20px;
      font-weight:700;
    }
    .logbox{
      margin-top:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      border-radius:14px;
      padding:14px;
      min-height:130px;
      color:#e6e6ef;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:12px;
      white-space:pre-wrap;
    }
    .smallBtn{
      display:inline-block;
      padding:12px 16px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.10);
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }
    .okRow{
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin-top:18px;
      color:#eaf8ef;
      font-size:18px;
      line-height:1.35;
    }
    .okIcon{
      font-size:20px;
      line-height:1;
      margin-top:2px;
    }
    .h2{
      margin:0 0 12px 0;
      font-size:44px;
      font-weight:900;
      line-height:1.02;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="./app.js" defer></script>
  <script src="./pi-auth.js" defer></script>
</body>
</html>
