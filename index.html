<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ultra Video Maker</title>

  <!-- Pi SDK (must stay) -->
  <script>
    (function () {
      if (window.Pi) return;
      var s = document.createElement('script');
      s.src = 'https://sdk.minepi.com/pi-sdk.js';
      s.async = true;
      document.head.appendChild(s);
    })();
  </script>

  <!-- React via CDN (no build step) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    :root{
      --bg:#0b0b0f;
      --card:#12121a;
      --muted:#a7a7b4;
      --accent:#7c3aed;
      --ok:#22c55e;
      --danger:#ef4444;
      --border:rgba(255,255,255,.10);
      --shadow: 0 12px 28px rgba(0,0,0,.45);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:#fff;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    a{color:#c4b5fd}
    .wrap{max-width:980px;margin:0 auto;padding:18px 14px 44px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .brand{display:flex;gap:10px;align-items:center}
    .chip{font-size:12px;color:#d1d5db;border:1px solid var(--border);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.03)}
    .grid{display:grid;grid-template-columns:1fr;gap:14px}
    @media (min-width: 940px){.grid{grid-template-columns: 1.1fr .9fr}}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
    h1{font-size:28px;margin:0 0 2px}
    h2{font-size:16px;margin:0 0 10px}
    .muted{color:var(--muted)}
    .row{display:grid;grid-template-columns:1fr;gap:10px}
    @media (min-width: 560px){.row{grid-template-columns:1fr 1fr}}
    label{display:block;font-size:12px;color:#d1d5db;margin:0 0 6px}
    input, select, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(0,0,0,.25);
      color:#fff;
      outline:none;
    }
    textarea{min-height:70px;resize:vertical}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:11px 14px;border-radius:12px;border:1px solid var(--border);
      background:rgba(255,255,255,.06);color:#fff;cursor:pointer;
      font-weight:600;
    }
    .btn.primary{background:var(--accent);border-color:rgba(124,58,237,.45)}
    .btn.ghost{background:transparent}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btnRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
    .statusLine{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
    .dot{width:10px;height:10px;border-radius:999px;background:var(--muted)}
    .dot.ok{background:var(--ok)}
    .dot.bad{background:var(--danger)}
    .previewBox{display:grid;gap:10px}
    .stage{
      width:100%;
      aspect-ratio: 9 / 16;
      background:#07070b;
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      position:relative;
    }
    video, canvas{width:100%;height:100%;display:block}
    .help{font-size:12px;color:var(--muted);line-height:1.35}
    .pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:999px;padding:6px 10px;background:rgba(255,255,255,.03);font-size:12px;color:#e5e7eb}
    .log{
      background:rgba(0,0,0,.35);
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      font-size:12px;
      color:#cbd5e1;
      max-height:160px;
      overflow:auto;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Pi auth + payment (must stay) -->
  <script src="./pi-auth.js"></script>
  <script src="./app.js"></script>
</body>
</html>
