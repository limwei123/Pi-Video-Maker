<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultra Video Maker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#e5e7eb; padding:20px; }
    button { padding:12px 18px; margin:8px 0; font-size:16px; border-radius:8px; border:none; cursor:pointer; }
    #signinBtn { background:#a5b4fc; }
    #payBtn { background:#86efac; }
    #status { margin:10px 0; font-weight:bold; }
    pre { background:#020617; padding:10px; border-radius:6px; max-height:200px; overflow:auto; }
  </style>
</head>
<body>
  <h2>Ultra Video Maker</h2>

  <div id="status">Loading Pi SDK…</div>
  <div id="userLine"></div>

  <button id="signinBtn" onclick="__piSignInClick()" disabled>Sign in with Pi</button><br/>
  <button id="payBtn" onclick="__piPayClick()" disabled>Pay with Pi (1 Pi)</button>

  <h3>Log</h3>
  <pre id="log"></pre>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="./pi-auth.js"></script>
</body>
</html>
