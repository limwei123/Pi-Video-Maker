<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ultra Video Maker</title>

  <script>
    (function () {
      if (window.Pi) return;
      var s = document.createElement('script');
      s.src = 'https://sdk.minepi.com/pi-sdk.js';
      s.async = true;
      document.head.appendChild(s);
    })();
  </script>
</head>

<body style="background:#0b0b0f;color:white;font-family:sans-serif;padding:16px">
  <h1>Ultra Video Maker</h1>

  <div id="status">Loading…</div>

  <button id="signinBtn" onclick="window.__piSignInClick()" disabled>
    Sign in with Pi
  </button>

  <br><br>

  <button id="payBtn" onclick="window.__piPayClick()" disabled>
    Pay with Pi (1 Pi)
  </button>

  <p id="userLine">Not signed in</p>

  <pre id="log"></pre>

  <script src="./pi-auth.js"></script>
</body>
</html>
